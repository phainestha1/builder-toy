# 프로젝트 설정. 훅(.claude/hooks/*.sh)이 bash로 이 파일을 source 한다.
# 값만 바꾸면 된다. 이 파일이 없으면 훅은 아래와 같은 기본값으로 동작한다.
# 문법은 bash 변수 대입이다. `=` 앞뒤에 공백을 넣지 않는다.

# 세션 시작 안내에 보이는 프로젝트 이름.
PROJECT_NAME="my-project"

# 보호할 기본 브랜치. 이 브랜치에서 commit·merge, 이 브랜치로 push를 막는다.
# 예: 기본 브랜치가 master나 trunk라면 MAIN_BRANCH="trunk"
MAIN_BRANCH="main"

# 타입·린트·테스트·구조 검사를 한 번에 돌리는 명령.
# 이 명령을 실행하면 테스트 건수 확인 훅이 출력에서 실행 건수를 찾는다.
# 프로젝트에 맞게 바꾼다. 예:
#   Node:   CHECK_CMD="npm run check"
#   Python: CHECK_CMD="pytest"            (또는 "make check")
#   Go:     CHECK_CMD="go test ./..."
#   Rust:   CHECK_CMD="cargo test"
#   Java:   CHECK_CMD="./gradlew test"    (또는 "mvn test")
CHECK_CMD="npm run check"

# 계약 파일 목록. 저장소 루트 기준 경로를 bash `case` 패턴으로 쓰고, 공백으로 구분한다.
# 여기에 걸린 파일은 contract/* 브랜치에서만 고칠 수 있다.
# `*`는 `/`도 넘어서 맞는다. 예: "src/modules/*/ports/*" 는 src/modules/a/ports/b/c.ts 도 맞는다.
# 예: Go 프로젝트라면 CONTRACT_PATTERNS="docs/glossary.md internal/contracts/* api/*.proto"
CONTRACT_PATTERNS="docs/glossary.md src/modules/shared/events/* src/modules/*/ports/*"

# 보드(docs/board.md) 작업 ID 접두어. 세션 시작 훅이 `| T-xx |` 행을 읽는다.
# 예: 이슈 번호를 쓰면 TASK_ID_PREFIX="#"
TASK_ID_PREFIX="T-"
